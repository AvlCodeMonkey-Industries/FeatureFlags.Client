version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # DotNet SDK
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday" # updates are mostly released on Tuesday
    cooldown:
      default-days: 7
    ignore:
      # Stay on the .NET 10 LTS SDK: take 10.0.x feature-band/patch updates only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet:
        patterns: ["*"]

  # DotNet
  - package-ecosystem: "nuget"
    # Look for a solution file in this directory
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Packages versioned in lockstep with .NET: stay on the 10.x line (.NET 10 LTS).
      # Third-party packages are not pinned by version number; their majors don't
      # track .NET. If one drops net10.0 support, `dotnet restore` fails with NU1202
      # in CI, and that package can be ignored here individually.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
        # Majors arrive as separate PRs so one incompatible package can't block the rest.
        update-types: ["minor", "patch"]
